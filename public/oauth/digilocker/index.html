<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The sign-in code is in this page's URL: never send it anywhere. -->
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Back to Buddy</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fff; color: #1e1e1e; text-align: center; padding: 24px; box-sizing: border-box;
    }
    @media (prefers-color-scheme: dark) { body { background: #121212; color: #f6dde1; } }
    main { max-width: 320px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.4; margin: 0 0 24px; opacity: .75; }
    a {
      display: inline-block; padding: 16px 32px; border-radius: 16px; text-decoration: none;
      font-weight: 600; background: #1e1e1e; color: #f6dde1;
    }
    @media (prefers-color-scheme: dark) { a { background: #f6dde1; color: #1e1e1e; } }
  </style>
</head>
<body>
  <main>
    <h1>Returning you to Buddy</h1>
    <p>If Buddy didn't open on its own, tap the button below.</p>
    <a id="open" href="com.buddytechindia.buddy://digilocker">Open Buddy</a>
  </main>
  <script>
    // DigiLocker lands here with ?state=...&code=... (or ?error=...). Hand the
    // same query to the app, then drop it from this page's address.
    (function () {
      var appUrl = 'com.buddytechindia.buddy://digilocker' + window.location.search;
      document.getElementById('open').setAttribute('href', appUrl);
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
      window.location.replace(appUrl);
    })();
  </script>
</body>
</html>
